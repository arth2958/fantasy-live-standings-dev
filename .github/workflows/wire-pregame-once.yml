name: Wire pregame Elo dev preview once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check and insert external script tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('projections.html')
          b = p.read_bytes()
          expected = 'd0928b82d11bd972a1cb0783410dd2f66b4c26f2d6f67ce742cd9cdf08ee0643'
          assert hashlib.sha256(b).hexdigest() == expected, 'HTML changed; refusing edit'
          tag = b'<script src="pregame-odds.js"></script>'
          assert tag not in b and b.count(b'</body>') == 1, 'Unexpected HTML structure'
          assert Path('pregame-odds.js').is_file(), 'Annotation file missing'
          p.write_bytes(b.replace(b'</body>', tag + b'</body>'))
          PY
      - name: Commit narrow preview edit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projections.html
          git commit -m 'Wire pre-game Elo annotation on dev preview'
          git push
