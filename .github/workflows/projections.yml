name: Update projections (dev preview)
on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dev-projections
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Read official standings (read-only)
        run: curl --fail --location --retry 2 --max-time 45 https://arth2958.github.io/fantasy-live-standings/data/standings-s50.json -o data/standings-s50.json
      - run: python scripts/update_projections.py
      - name: Commit dev projection artifact only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/projections-s50.json
          git diff --cached --quiet || (git commit -m "Update dev projections" && git push || (git pull --rebase -X theirs && git push))
