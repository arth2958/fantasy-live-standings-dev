name: Update projections (dev preview)
on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dev-projections
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Build dev standings with checked round history
        run: python scripts/update_s50.py
      - run: python scripts/update_projections.py
      - name: Commit refreshed dev standings and projection snapshots
        run: |
          # DEV ONLY: regenerate checked history with standings totals.
          # Otherwise the dev standings page stays stuck at the original mirror date.
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/projections-s50.json data/standings-s50.json
          git diff --cached --quiet || (git commit -m "Update dev projections" && git push || (git pull --rebase -X theirs && git push))
