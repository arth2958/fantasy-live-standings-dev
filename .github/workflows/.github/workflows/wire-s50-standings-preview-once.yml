name: Build standings odds dev preview once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated dev standings preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, urllib.request
          base = 'https://arth2958.github.io/fantasy-live-standings/'
          paths = {'s50/index.html':'51c92cb69fa676e56b9c1c50caa74441bf8a344a35b41176f9aee4999ae52ea7',
                   's50/app.js':'69fdffe11b2353d0236657f973c00dd080364b34bc84f78ab0e94b9ccb7f04fb',
                   's50/status.css':'f24aa330dd00a347f25e77ed8ee3aab88d9820af80a5e7c05229429795d68925'}
          assert Path('s50/s50/standings-odds.js').exists(), 'Dev odds source missing'
          assert not Path('s50/index.html').exists(), 'Dev standings page unexpectedly exists'
          Path('s50').mkdir(exist_ok=True)
          source = Path('s50/s50/standings-odds.js').read_bytes()
          assert hashlib.sha256(source).hexdigest() == '546ff58b5a90f77ece81bf6d59e2c3c97cc2c4717d304d2247c672050dfd3631'
          Path('s50/standings-odds.js').write_bytes(source)
          for path, sha in paths.items():
              data = urllib.request.urlopen(base+path).read()
              assert hashlib.sha256(data).hexdigest() == sha, path+' source changed'
              Path(path).write_bytes(data)
          page = Path('s50/index.html').read_text()
          page = page.replace('../style.css?v=final19', base+'style.css?v=final19')
          page = page.replace('src="../seasons.js?v=12"', 'src="'+base+'seasons.js?v=12"')
          page = page.replace('href="../projections/"', 'href="../projections.html?filter=fantasy"')
          page = page.replace('href="../hall-of-fame/"', 'href="../#hall-of-fame"')
          page = page.replace('app.js?v=18', 'app.js?v=dev1')
          page = page.replace('</body>', '<script src="standings-odds.js?v=dev1"></script></body>')
          page = page.replace('<body data-season="50"', '<body data-season="50" style="border-top:9px solid #f4c943"')
          page = page.replace('<header>', '<div style="background:#f4c943;color:#332b10;text-align:center;padding:8px;font-weight:900">DEV PREVIEW - PRODUCTION UNCHANGED</div><header>', 1)
          Path('s50/index.html').write_text(page)
          app = Path('s50/app.js').read_text()
          app = app.replace("'../data/standings-s50.json?'", "'"+base+"data/standings-s50.json?'")
          app = app.replace("'../data/projections-s50.json?'", "'"+base+"data/projections-s50.json?'")
          Path('s50/app.js').write_text(app)
          src = Path('s50/app.js').read_text()
          assert "https://arth2958.github.io/fantasy-live-standings/data/standings-s50.json?" in src
          assert "https://arth2958.github.io/fantasy-live-standings/data/projections-s50.json?" in src
          assert 'standings-odds.js?v=dev1' in page
          assert 'DEV PREVIEW - PRODUCTION UNCHANGED' in page
          PY
      - name: Commit isolated preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add s50/index.html s50/app.js s50/status.css s50/standings-odds.js
          git commit -m 'Build dev-only S50 standings odds preview'
          git push
